<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Área de Membros — Acesso</title>
<style>
:root{--bg:#0e0f16;--card:#171926;--card2:#1f2231;--linha:#2a2e40;--txt:#eef0f6;--txt2:#8d93a8;--acento:#ff7a1a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.caixa{width:100%;max-width:380px;background:var(--card);border:1px solid var(--linha);
  border-radius:18px;padding:32px 28px;text-align:center}
.caixa h1{margin:0 0 6px;font-size:20px;letter-spacing:-.3px}
.caixa p{margin:0 0 22px;color:var(--txt2);font-size:13.5px}
.campo{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--linha);
  background:var(--card2);color:var(--txt);font:inherit;font-size:15px;text-align:center}
.campo:focus{outline:2px solid var(--acento);outline-offset:-1px}
.btn{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:0;
  background:var(--acento);color:#0b0b0d;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.erro{margin-top:12px;font-size:13px;color:#ff6b6b;min-height:16px}
</style></head><body>

<form class="caixa" id="form-acesso">
  <h1>Área de Membros</h1>
  <p>Digite o e-mail que você usou na compra.</p>
  <input class="campo" id="email" type="email" placeholder="seu@email.com" autocomplete="email" autofocus>
  <button class="btn" type="submit">Entrar</button>
  <p class="erro" id="erro"></p>
</form>

<script>
const ls = { get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},
             set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

if (ls.get('acesso90-email')) location.href = 'membros.html';

const form = document.getElementById('form-acesso');
const botao = form.querySelector('button');
const erro = document.getElementById('erro');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email) return;
  erro.textContent = '';
  botao.disabled = true;
  botao.textContent = 'Verificando...';
  try {
    const r = await fetch('/api/checar-acesso', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await r.json();
    if (data.ok) {
      ls.set('acesso90-email', email);
      location.href = 'membros.html';
      return;
    }
    erro.textContent = 'E-mail não encontrado nas compras aprovadas. Confira se digitou certo, ou aguarde alguns minutos após a compra.';
  } catch (err) {
    erro.textContent = 'Não deu pra verificar agora. Tenta de novo em instantes.';
  }
  botao.disabled = false;
  botao.textContent = 'Entrar';
});
</script>
</body></html>
